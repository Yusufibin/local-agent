name: Agent evaluation
on:
  workflow_dispatch:
    inputs:
      model:
        description: Anthropic model ID
        required: true
        type: string
      budget_usd:
        description: Stop starting tasks once reported cost reaches this amount
        default: "2"
        required: true
        type: string
      thinking:
        description: Thinking level
        default: "off"
        type: choice
        options: [off, low, medium, high]
permissions:
  contents: read
jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: agent-evaluation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global --ignore-scripts @earendil-works/pi-coding-agent@0.85.1
      - run: pnpm eval -- --validate
      - name: Evaluate product runtime
        run: pnpm eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}
          DESKPI_PROVIDER: anthropic
          DESKPI_MODEL: ${{ inputs.model }}
          EVAL_BUDGET_USD: ${{ inputs.budget_usd }}
          EVAL_THINKING: ${{ inputs.thinking }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-evaluation
          path: evaluations/results/
