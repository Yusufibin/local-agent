name: Quality

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/frontend-build-check.mjs
      - run: pnpm eval -- --validate

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
        continue-on-error: true
        id: format
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
        if: always()
      - name: Formatting diagnostics
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          python3 - <<'PY'
          import json, pathlib, subprocess
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          if pathlib.Path("src-tauri/Cargo.lock").exists(): changed.append("src-tauri/Cargo.lock")
          for name in changed:
              if name.endswith(".rs") or name.endswith("Cargo.lock"):
                  print("FORMATTED_SOURCE " + json.dumps({"path": name, "content": pathlib.Path(name).read_text()}))
          PY
      - name: Require formatted sources
        if: steps.format.outcome == 'failure'
        shell: bash
        run: exit 1

  lock-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read package metadata
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          for (const [name, version] of [["tinyspy","4.0.6"],["@vitest/spy","3.2.7"],["@vitest/snapshot","3.2.7"],["postcss","8.5.28"]]) {
            const response = await fetch("https://registry.npmjs.org/" + encodeURIComponent(name) + "/" + version);
            if (!response.ok) throw new Error("Registry request failed");
            const metadata = await response.json();
            console.log("REGISTRY_METADATA " + JSON.stringify({name,version,integrity:metadata.dist.integrity}));
          }
          JS
